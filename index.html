<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050b18">
  <title>Nexora AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #050b18;
      color: #eaf5ff;
      min-height: 100vh;
    }
    header {
      padding: 20px;
      border-bottom: 1px solid #18314b;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      color: #38d9ff;
      font-size: 25px;
      font-weight: bold;
      text-shadow: 0 0 15px #00bfff;
    }
    .status { color: #7e9bb5; font-size: 12px; }
    main {
      max-width: 750px;
      margin: 0 auto;
      padding: 35px 18px;
    }
    .welcome { text-align: center; margin: 55px 0 35px; }
    h1 {
      font-size: 38px;
      margin-bottom: 12px;
      background: linear-gradient(90deg,#36d9ff,#8b7cff);
      color: transparent;
      background-clip: text;
    }
    .welcome p { color: #91a9c2; line-height: 1.6; }
    #chat {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 20px;
    }
    .message {
      padding: 14px 16px;
      border-radius: 14px;
      max-width: 90%;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .user {
      align-self: flex-end;
      background: #123b5a;
      border: 1px solid #1679a8;
    }
    .bot {
      align-self: flex-start;
      background: #101d30;
      border: 1px solid #21415d;
    }
    .input-area {
      display: flex;
      gap: 10px;
      padding: 10px;
      background: #0d1929;
      border: 1px solid #245174;
      border-radius: 15px;
      box-shadow: 0 0 18px #008cff18;
    }
    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      color: white;
      background: transparent;
      border: none;
      outline: none;
      font-size: 15px;
    }
    button {
      padding: 12px 19px;
      border: none;
      border-radius: 10px;
      background: #16bce9;
      color: #00121e;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #72e4ff; }
    footer {
      text-align: center;
      color: #58728c;
      font-size: 12px;
      padding: 25px;
    }
    @media(max-width: 480px) {
      h1 { font-size: 31px; }
      main { padding-top: 15px; }
      .welcome { margin-top: 45px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">✦ Nexora AI</div>
    <div class="status">Your AI workspace</div>
  </header>

  <main>
    <section class="welcome">
      <h1>Welcome to Nexora AI</h1>
      <p>Your ideas. Your intelligence. Your future.<br>
      Start a conversation below.</p>
    </section>

    <section id="chat" aria-live="polite"></section>

    <form class="input-area" id="chatForm">
      <input id="messageInput" type="text"
        placeholder="Ask Nexora anything..." autocomplete="off">
      <button type="submit">Send ➤</button>
    </form>
  </main>

  <footer>© 2026 Nexora AI · Built for the future 🚀</footer>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const chat = document.getElementById("chat");

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      addMessage("Hello! I'm Nexora AI. Your chat interface is ready. AI connection is coming soon!", "bot");
      input.value = "";
    });

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      chat.appendChild(div);
    }
  </script>
</body>
</html>
